site_name: LUNA XAI
site_description: Local Understanding through Neighborhood Analysis
site_author: Marcelo I. Reis
repo_url: https://github.com/mindior/LUNA
repo_name: mindior/LUNA

theme:
  name: material
  logo: assets/images/luna_logo.png
  favicon: assets/images/luna_logo.png

nav:
  - Home: index.md
  - API Reference: reference.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy  
            docstring_section_style: table
            show_source: true

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

docs_dir: docs_src
site_dir: docs    

