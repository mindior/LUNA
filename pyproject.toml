[tool.poetry]
name = "luna-xai"
version = "0.1.6"
description = "LUNA — Local Understanding through Neighborhood Analysis"
maintainers = [
    "Marcelo I. Reis <mindior@gmail.com>"
    ]
authors = [
    "Marcelo I. Reis <mindior@gmail.com>",  
    "Paulo Cortez <pcortez@dsi.uminho.pt>", 
    "João N.C. Gonçalves <jngoncalves@ucp.pt>", 
    "M. Sameiro Carvalho <sameiro@dps.uminho.pt>"
    ]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/mindior/LUNA"
repository = "https://github.com/mindior/LUNA"
documentation = "https://mindior.github.io/LUNA/"
keywords = [
    "explainable ai",
    "xai",
    "interpretability",
    "machine learning",
    "tabular",
    "hnsw",
    "ai"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

packages = [{ include = "luna_xai", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# Core stack
numpy = ">=2.0,<3.0"
pandas = "^2.1.0"
scikit-learn = "^1.4.0"
scipy = "^1.11.0"

# Neighborhood model
hnswlib = "^0.8.0"

# Parquet support
pyarrow = ">=26.0,<27.0"

# Visualization
matplotlib = "^3.8.0"

# Excel IO
openpyxl = "^3.1.0"

# Utility
joblib = "^1.3.0"
tqdm = "^4.0.0"
cane = "^2.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
mypy = "^1.10.0"
black = "^24.3.0"
ruff = "^0.5.0"

# Docs
mkdocs = "1.6.0"
mkdocs-material = "9.5.40"
mkdocstrings = { extras = ["python"], version = "0.26.1" }
mkdocs-autorefs = "1.2.0"
mkdocs-awesome-pages-plugin = "2.9.2"
griffe = "0.48.0"

[tool.poetry.scripts]
luna-xai = "luna_xai.__main__:main"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
select = ["E", "F", "I"]
ignore = ["E501"]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=luna_xai --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-report=html:reports/coverage_html"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: mark unit tests",
    "integration: mark integration tests"
]

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
